[pytest]
log_cli=true
log_cli_level=INFO

markers =
    APIKEY(id): link an API key test to its test-case ID
    APPNEG(id): link an application-negative test to its test-case ID
    APPS(id): link an applications test to its test-case ID
    AUTH(id): link an authentication test to its test-case ID
    AUDIT(id): link an application-audit-log test to its test-case ID
    PUBLIC(id): link a public API test to its test-case ID
